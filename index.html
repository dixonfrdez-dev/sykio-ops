<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sykio Ops v7.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 10px; padding-bottom: 75px; }

        header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #30363d; }
        h1 { font-size: 16px; color: #58a6ff; }
        .btn-agregar { background: #238636; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .tabs { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tab { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #30363d; color: #f0f6fc; border-color: #8b949e; }
        .section-content { display: none; }
        .section-content.active { display: block; }

        .widget-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
        .widget-header { background: #21262d; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-bottom: 1px solid #30363d; }
        .widget-title { color: #58a6ff; font-weight: bold; }
        .widget-controls button { background: none; border: none; color: #8b949e; cursor: pointer; margin-left: 8px; font-size: 14px; }
        
        /* Contenedor iframe para la página original */
        .iframe-container { width: 100%; height: 500px; background: #0d1117; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }

        .control-center { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; padding: 8px 12px; font-size: 12px; z-index: 99; }
        .control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .control-status { color: #3fb950; font-weight: bold; }
        .control-logs { background: #0d1117; padding: 6px; border-radius: 4px; border: 1px solid #30363d; font-family: monospace; font-size: 11px; color: #8b949e; max-height: 40px; overflow-y: auto; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; width: 90%; max-width: 320px; }
        .modal-content h3 { font-size: 15px; margin-bottom: 10px; color: #f0f6fc; }
        .modal-content select { width: 100%; padding: 8px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; margin-bottom: 15px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
        .btn-cancel { background: #30363d; color: #c9d1d9; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-ok { background: #238636; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Sykio Ops v7.1</h1>
        <button class="btn-agregar" id="abrirModal">Agregar</button>
    </header>

    <div class="tabs">
        <div class="tab active" data-target="ves-section">VES</div>
        <div class="tab" data-target="cripto-section">CRIPTO / USD</div>
        <div class="tab" data-target="transacciones-section">Transacciones</div>
    </div>

    <div id="ves-section" class="section-content active">
        <div id="widgets-container"></div>
    </div>

    <div id="cripto-section" class="section-content">
        <div style="text-align: center; color: #8b949e; padding: 20px;">No hay paneles de CRIPTO/USD.</div>
    </div>

    <div id="transacciones-section" class="section-content">
        <div class="widget-card">
            <div class="widget-header"><span class="widget-title">Historial Reciente</span></div>
            <div class="widget-body" style="padding: 12px; font-size: 12px; color: #8b949e;">
                No hay transacciones registradas.
            </div>
        </div>
    </div>

    <div class="control-center">
        <div class="control-header">
            <span>🟢 Centro de Control | Estado: <span class="control-status">Operando</span></span>
            <span style="color: #8b949e; font-size: 11px;">7:48:12 P.M.</span>
        </div>
        <div class="control-logs" id="logsSistema">
            [SISTEMA]: Widgets enlazados con la página original.
        </div>
    </div>

    <div class="modal" id="modalAgregar">
        <div class="modal-content">
            <h3>Seleccionar Panel</h3>
            <select id="servicioSelect">
                <option value="Pago Móvil / VES">Pago Móvil / VES</option>
                <option value="Banco de Venezuela / VES">Banco de Venezuela / VES</option>
                <option value="Banesco / VES">Banesco / VES</option>
                <option value="Bancamiga / VES">Bancamiga / VES</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cerrarModal">Cancelar</button>
                <button class="btn-ok" id="guardarPanel">Agregar</button>
            </div>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const sections = document.querySelectorAll('.section-content');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        const modal = document.getElementById('modalAgregar');
        document.getElementById('abrirModal').addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('cerrarModal').addEventListener('click', () => modal.style.display = 'none');

        const servicioSelect = document.getElementById('servicioSelect');
        document.addEventListener('DOMContentLoaded', renderizarWidgets);

        document.getElementById('guardarPanel').addEventListener('click', () => {
            const nombrePanel = servicioSelect.value;
            let widgets = JSON.parse(localStorage.getItem('sykio_widgets')) || [];
            widgets.push({ id: Date.now(), nombre: nombrePanel });
            localStorage.setItem('sykio_widgets', JSON.stringify(widgets));

            modal.style.display = 'none';
            renderizarWidgets();
            agregarLog(`Panel ${nombrePanel} agregado.`);
        });

        function eliminarWidget(id) {
            if (confirm("¿Eliminar este panel?")) {
                let widgets = JSON.parse(localStorage.getItem('sykio_widgets')) || [];
                widgets = widgets.filter(w => w.id !== id);
                localStorage.setItem('sykio_widgets', JSON.stringify(widgets));
                renderizarWidgets();
                agregarLog("Panel cerrado.");
            }
        }

        function renderizarWidgets() {
            const container = document.getElementById('widgets-container');
            container.innerHTML = '';
            let widgets = JSON.parse(localStorage.getItem('sykio_widgets')) || [];

            if (widgets.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 20px;">No hay paneles agregados. Usa el botón Agregar.</div>';
                return;
            }

            widgets.forEach(w => {
                const widgetHtml = `
                    <div class="widget-card">
                        <div class="widget-header">
                            <span class="widget-title">${w.nombre}</span>
                            <div class="widget-controls">
                                <button title="Cerrar" onclick="eliminarWidget(${w.id})">❌</button>
                            </div>
                        </div>
                        <div class="iframe-container">
                            <iframe src="https://explorer.sykio.io/swap#is_sending=true"></iframe>
                        </div>
                    </div>
                `;
                container.innerHTML += widgetHtml;
            });
        }

        function agregarLog(texto) {
            const logs = document.getElementById('logsSistema');
            const hora = new Date().toLocaleTimeString();
            logs.innerHTML += `<br>[${hora}]: ${texto}`;
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
