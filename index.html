<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syklo Ops Mobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background:#0f172a; color:#e2e8f0; padding:16px; margin:0; }
    h2 { margin-top:0; }
    .card { background:#1e293b; border-radius:8px; padding:12px; margin-bottom:12px; }
    button { background:#3b82f6; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; }
    button.secondary { background:#475569; }
    input { width:100%; padding:8px; margin:6px 0; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; }
    .status { font-weight:bold; }
    #syklo-frame-wrap { margin-top:10px; }
    #syklo-frame { width:100%; height:70vh; border:none; border-radius:8px; }
    #log { max-height:200px; overflow-y:auto; font-size:12px; background:#0f172a; padding:8px; border-radius:6px; }
    .log-entry { margin-bottom:4px; }
  </style>
</head>
<body>
  <h2>⚙️ Syklo Ops Mobile</h2>

  <!-- ESTADO DEL BOT -->
  <div class="card">
    <strong>Estado del Bot:</strong> <span id="bot-status" class="status">🔴 PAUSADO</span><br><br>
    <button id="toggle-bot">Activar / Pausar</button>
  </div>

  <!-- CONFIGURACIÓN -->
  <div class="card">
    <strong>Configuración</strong><br>
    <input id="trader-name" placeholder="Tu nombre de trader">
    <input id="telegram-token" placeholder="Bot Token">
    <input id="telegram-chatid" placeholder="Chat ID">
    <button id="save-config">Guardar</button>
  </div>

  <!-- SYKLO INTEGRADO -->
  <div class="card">
    <strong>🌐 Syklo Explorer</strong><br><br>
    <button id="toggle-syklo">Mostrar / Ocultar Explorer</button>
    <div id="syklo-frame-wrap" style="display:none;">
      <iframe id="syklo-frame" src="https://explorer.syklo.io/"></iframe>
    </div>
  </div>

  <!-- LOG DE ACTIVIDAD -->
  <div class="card">
    <strong>📋 Actividad</strong>
    <div id="log"><div class="log-entry">Esperando actividad...</div></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
