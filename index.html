<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syklo Trading Workstation Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1120; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header { background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .brand { font-size: 1.1rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .badge { background: #16a34a; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }

    /* Contenedor dividido en 2 columnas */
    .workspace { display: flex; flex: 1; height: calc(100vh - 53px); }
    
    /* Panel izquierdo: Controles y tabla de tasas */
    .sidebar { width: 380px; background: #0f172a; border-right: 1px solid #334155; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1e293b; border-radius: 8px; padding: 14px; border: 1px solid #334155; }
    .card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; }
    
    .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #334155; background: #0b1120; color: #fff; font-size: 0.85rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    
    .btn { background: #2563eb; color: #fff; padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    /* Tabla de Tasas Configuradas */
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: left; }
    th { color: #94a3b8; padding: 6px; border-bottom: 1px solid #334155; }
    td { padding: 8px 6px; border-bottom: 1px solid #1e293b; }
    .rate-badge { color: #38bdf8; font-weight: bold; }

    /* Panel derecho: Visor integrado de Syklo */
    .frame-container { flex: 1; background: #020617; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      ⚡ Syklo Trading Desk
      <span class="badge" id="syncStatus">Extensión Enlazada</span>
    </div>
    <div>
      <button class="btn" id="reloadFrameBtn" style="padding: 4px 10px; font-size: 0.75rem;">🔄 Recargar Syklo</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Panel Izquierdo -->
    <div class="sidebar">
      
      <!-- Agregar nueva regla de tasa -->
      <div class="card">
        <h3>+ Monitorear Nueva Tasa</h3>
        <div class="input-row">
          <input type="text" id="pairName" placeholder="Ej: COP / USDC">
          <input type="number" id="targetRate" step="0.01" placeholder="Tasa Ref">
        </div>
        <div class="input-row">
          <input type="number" id="alertMargin" step="0.1" placeholder="Margen (%)" value="1.2">
          <button class="btn" id="addRateBtn">Agregar</button>
        </div>
      </div>

      <!-- Tabla de Tasas a Seguir -->
      <div class="card" style="flex: 1;">
        <h3>Tasas en Monitoreo</h3>
        <table>
          <thead>
            <tr>
              <th>Par</th>
              <th>Tasa Obj</th>
              <th>Margen</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="ratesTableBody">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>

      <!-- Parámetros del AutoTrader -->
      <div class="card">
        <h3>Ajuste Automático</h3>
        <label style="font-size: 0.75rem; color: #94a3b8;">Precio Mínimo de Seguridad:</label>
        <input type="number" id="safetyMin" step="0.01" value="1.00" style="margin: 6px 0 10px 0;">
        <button class="btn" id="saveAutoTraderBtn" style="width: 100%;">Activar AutoTrader</button>
      </div>

    </div>

    <!-- Panel Derecho: Syklo WebApp -->
    <div class="frame-container">
      <iframe id="sykloFrame" src="https://webapp.syklo.io/"></iframe>
    </div>
  </div>

  <script>
    let monitoredRates = JSON.parse(localStorage.getItem("syklo_monitored_rates") || "[]");

    function renderRates() {
      const tbody = document.getElementById("ratesTableBody");
      tbody.innerHTML = "";
      
      if (monitoredRates.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#64748b; text-align:center; padding:12px;">Sin tasas configuradas</td></tr>`;
        return;
      }

      monitoredRates.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><b>${item.pair}</b></td>
          <td class="rate-badge">${item.target}</td>
          <td>${item.margin}%</td>
          <td><button class="btn btn-danger" style="padding:2px 6px; font-size:0.7rem;" onclick="removeRate(${index})">✕</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.removeRate = function(index) {
      monitoredRates.splice(index, 1);
      localStorage.setItem("syklo_monitored_rates", JSON.stringify(monitoredRates));
      renderRates();
      syncWithExtension();
    };

    document.getElementById("addRateBtn").addEventListener("click", () => {
      const pair = document.getElementById("pairName").value.trim() || "P2P Tasa";
      const target = parseFloat(document.getElementById("targetRate").value) || 0;
      const margin = parseFloat(document.getElementById("alertMargin").value) || 1.0;

      if (target <= 0) return alert("Ingresa una tasa válida");

      monitoredRates.push({ pair, target, margin });
      localStorage.setItem("syklo_monitored_rates", JSON.stringify(monitoredRates));
      renderRates();
      syncWithExtension();

      document.getElementById("pairName").value = "";
      document.getElementById("targetRate").value = "";
    });

    function syncWithExtension() {
      const safetyMin = parseFloat(document.getElementById("safetyMin").value) || 1.0;
      window.postMessage({
        type: "SYKLO_UPDATE_RULES",
        rules: monitoredRates,
        safetyMin: safetyMin
      }, "*");
    }

    document.getElementById("saveAutoTraderBtn").addEventListener("click", () => {
      syncWithExtension();
      alert("Parámetros y reglas enviadas al AutoTrader.");
    });

    document.getElementById("reloadFrameBtn").addEventListener("click", () => {
      document.getElementById("sykloFrame").src = "https://webapp.syklo.io/";
    });

    renderRates();
  </script>
</body>
</html>
