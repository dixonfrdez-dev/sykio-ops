<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syklo Ops Desk & Alerter Pro</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1e293b;
      --accent: #00d2ff;
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* Barra Superior / Navegación */
    header { background: #0f172a; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.1rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .tab-btn.active { background: #1e293b; color: var(--accent); border-color: var(--accent); }
    .tab-btn:hover { color: #fff; }

    .main-container { padding: 24px; max-width: 1200px; margin: auto; width: 100%; flex: 1; }
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Estilos del Monitor de Tasas */
    .grid-2 { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border); }
    .card h3 { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 14px; letter-spacing: 0.05em; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #090d16; color: #fff; font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--accent); }

    .btn { background: #2563eb; color: #fff; padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.9rem; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-green { background: #059669; }
    .btn-green:hover { background: #047857; }

    /* Tabla de Precios */
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: var(--text-muted); padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    td { padding: 12px 10px; border-bottom: 1px solid #1a2333; }
    .rate-chip { background: rgba(0, 210, 255, 0.1); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-weight: bold; }
    .btn-del { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .btn-del:hover { background: var(--red); color: white; }

    /* Estilos de la Pestaña Transacciones / Syklo */
    .launch-box { text-align: center; padding: 40px 20px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); max-width: 600px; margin: 40px auto; }
    .launch-box h2 { font-size: 1.4rem; margin-bottom: 10px; color: #fff; }
    .launch-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }
    .action-btn-large { padding: 14px 28px; font-size: 1rem; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚡ <span>Syklo Ops Pro</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('monitor')">📊 Monitor de Precios</button>
      <button class="tab-btn" onclick="switchTab('transactions')">💳 Transacciones (Syklo Web)</button>
    </div>
  </header>

  <div class="main-container">

    <!-- SECCIÓN 1: MONITOR DE TASAS -->
    <div id="view-monitor" class="view-section active">
      <div class="grid-2">
        
        <!-- Formulario para agregar tasas -->
        <div class="card">
          <h3>+ Añadir Tasa a Monitorear</h3>
          <div class="form-group">
            <label>Moneda / Par:</label>
            <input type="text" id="currencyPair" placeholder="Ej: USD / COP, USDC / VES">
          </div>
          <div class="form-group">
            <label>Tasa Objetivo (Precio Referencia):</label>
            <input type="number" id="targetRate" step="0.01" placeholder="Ej: 4200.00">
          </div>
          <div class="form-group">
            <label>Margen AutoTrader (%):</label>
            <input type="number" id="alertMargin" step="0.1" value="1.2">
          </div>
          <button class="btn" id="addPriceBtn">Guardar en Lista</button>
        </div>

        <!-- Lista activa de tasas -->
        <div class="card">
          <h3>Lista de Precios en Monitoreo</h3>
          <table>
            <thead>
              <tr>
                <th>Par</th>
                <th>Tasa Objetivo</th>
                <th>Margen</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="priceListBody">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>

      </div>
    </div>

    <!-- SECCIÓN 2: TRANSACCIONES (SYKLO) -->
    <div id="view-transactions" class="view-section">
      <div class="launch-box">
        <h2>Panel de Transacciones Syklo</h2>
        <p>Abre la interfaz de operaciones P2P en una ventana lateral sincronizada con tus reglas de precios y la extensión activa.</p>
        <button class="btn btn-green action-btn-large" id="openSykloWindowBtn">
          🚀 Abrir Syklo en Modo Operación
        </button>
      </div>
    </div>

  </div>

  <script>
    // Gestión de Pestañas
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

      if (tabId === 'monitor') {
        document.querySelector("button[onclick="switchTab('monitor')"]").classList.add('active');
        document.getElementById('view-monitor').classList.add('active');
      } else {
        document.querySelector("button[onclick="switchTab('transactions')"]").classList.add('active');
        document.getElementById('view-transactions').classList.add('active');
      }
    }

    // Manejo de la Lista de Precios
    let priceRules = JSON.parse(localStorage.getItem("syklo_price_rules") || "[]");

    function renderPriceTable() {
      const tbody = document.getElementById("priceListBody");
      tbody.innerHTML = "";

      if (priceRules.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:20px;">No hay tasas añadidas todavía.</td></tr>`;
        return;
      }

      priceRules.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><b>${item.pair}</b></td>
          <td><span class="rate-chip">${item.target}</span></td>
          <td>${item.margin}%</td>
          <td style="color:#10b981;">● Activo</td>
          <td><button class="btn-del" onclick="deleteRule(${index})">Eliminar</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.deleteRule = function(index) {
      priceRules.splice(index, 1);
      localStorage.setItem("syklo_price_rules", JSON.stringify(priceRules));
      renderPriceTable();
      broadcastToExtension();
    };

    document.getElementById("addPriceBtn").addEventListener("click", () => {
      const pair = document.getElementById("currencyPair").value.trim() || "USDC / FIAT";
      const target = parseFloat(document.getElementById("targetRate").value) || 0;
      const margin = parseFloat(document.getElementById("alertMargin").value) || 1.2;

      if (target <= 0) return alert("Por favor ingresa un precio válido");

      priceRules.push({ pair, target, margin });
      localStorage.setItem("syklo_price_rules", JSON.stringify(priceRules));
      renderPriceTable();
      broadcastToExtension();

      document.getElementById("currencyPair").value = "";
      document.getElementById("targetRate").value = "";
    });
