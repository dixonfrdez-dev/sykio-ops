<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Syklo Ops Dashboard v8.0 (Popup Desk)</title>
    <meta name="theme-color" content="#0f172a"/>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #334155;
            --bg-card: #1e293b; --border-color: #334155; --text-primary: #f1f5f9;
            --text-secondary: #94a3b8; --accent-primary: #3b82f6; --accent-danger: #ef4444;
            --accent-pin: #f59e0b; --accent-green: #10b981;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius: 8px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-family); background-color: var(--bg-primary); color: var(--text-primary); }
        #app-container { display: flex; flex-direction: column; min-height: 100vh; }
        #app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 18px; font-weight: 700; color: #38bdf8; }
        .header-controls button { background-color: var(--accent-primary); color: white; border: none; padding: 10px 18px; font-size: 14px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .header-controls button:hover { background-color: #2563eb; }
        
        #tab-nav { display: flex; background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 0 20px; gap: 8px; position: sticky; top: 61px; z-index: 999; }
        .tab-btn { padding: 12px 20px; font-size: 14px; background: transparent; border: none; border-bottom: 3px solid transparent; color: var(--text-secondary); cursor: pointer; font-weight: 600; }
        .tab-btn.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        
        .panel-grid { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
        .grid-panel { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); display: flex; flex-direction: column; padding: 16px; box-shadow: var(--shadow); transition: transform 0.2s, border-color 0.2s; }
        .grid-panel.pinned { border-left: 4px solid var(--accent-pin); }
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .panel-title { font-weight: 600; font-size: 15px; }
        
        .panel-body { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; justify-content: space-between; }
        .panel-btn-open { background-color: var(--accent-primary); color: white; border: none; padding: 10px; border-radius: var(--radius); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-decoration: none; }
        .panel-btn-open:hover { background-color: #2563eb; }
        
        .panel-controls { display: flex; gap: 6px; }
        .panel-controls button { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; border-radius: 4px; }
        .panel-controls button:hover { color: var(--text-primary); }
        .panel-controls button.active { color: var(--accent-pin); }

        /* Estilos Pestaña Transacciones */
        .trans-hero { text-align: center; max-width: 600px; margin: 60px auto; padding: 32px; background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color); }
        .trans-hero h2 { margin-bottom: 10px; }
        .trans-hero p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
        .btn-launch-main { background-color: var(--accent-green); color: white; border: none; padding: 14px 28px; border-radius: var(--radius); font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-launch-main:hover { background-color: #059669; }

        /* Modal */
        .empty-state { display: none; text-align: center; padding: 40px; color: var(--text-secondary); }
        .empty-state.visible { display: block; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal { background: var(--bg-secondary); border-radius: var(--radius); width: 90%; max-width: 480px; padding: 24px; }
        select { width: 100%; padding: 10px; margin-top: 10px; border-radius: var(--radius); background: var(--bg-primary); color: white; border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div id="app-container">
        <header id="app-header">
            <div class="logo">Syklo Ops Desk v8.0</div>
            <div class="header-controls">
                <button id="add-panel-btn">+ Agregar Monitor</button>
            </div>
        </header>

        <nav id="tab-nav">
            <button class="tab-btn active" data-tab="ves">VES</button>
            <button class="tab-btn" data-tab="cripto">CRIPTO / USD</button>
            <button class="tab-btn" data-tab="global">Transacciones</button>
        </nav>

        <main id="content-container">
            <!-- Pestaña VES -->
            <div id="tab-panel-ves" class="tab-panel active">
                <div class="panel-grid" id="ves-grid"></div>
                <div class="empty-state" id="ves-empty-state"><p>No hay paneles agregados en VES.</p></div>
            </div>

            <!-- Pestaña CRIPTO / USD -->
            <div id="tab-panel-cripto" class="tab-panel">
                <div class="panel-grid" id="cripto-grid"></div>
                <div class="empty-state" id="cripto-empty-state"><p>No hay paneles agregados en CRIPTO/USD.</p></div>
            </div>

            <!-- Pestaña Transacciones -->
            <div id="tab-panel-global" class="tab-panel">
                <div class="trans-hero">
                    <h2>Transacciones en Vivo</h2>
                    <p>Abre la consola de órdenes de Syklo en una subventana flotante para operar sin restricciones de navegador.</p>
                    <button class="btn-launch-main" onclick="openSykloWindow('https://webapp.syklo.io/transactions', 'SykloTransacciones')">
                        🚀 Abrir Consola de Transacciones
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Agregar -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3>Seleccionar Mercado para Monitorear</h3>
            <select id="panel-opcion">
                <option value="" disabled selected>Elige un servicio...</option>
                <optgroup label="VES">
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:PF&receive_pms=VES:VE:PF">📱 Pago Móvil | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:VEBN1&receive_pms=VES:VE:VEBN1">🏦 Banesco | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:VEBN5&receive_pms=VES:VE:VEBN5">🏦 Bancamiga | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:VEBN29&receive_pms=VES:VE:VEBN29">🏦 BNC | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:VEBN2&receive_pms=VES:VE:VEBN2">🏦 Venezuela | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:VEBN15&receive_pms=VES:VE:VEBN15">🏦 Mercantil | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&receive_pms=VES:VE:UB&send_pms=VES:VE:UB">🏦 Ubii | VES</option>
                    <option data-category="VES" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=VES:VE:VEBN3&receive_pms=VES:VE:VEBN3">🏦 Provincial | VES</option>
                </optgroup>
                <optgroup label="CRIPTO / USD">
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&receive_pms=USD:ALL:WTE&send_pms=USD:ALL:WTE">💵 Wally | USD</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=USD:ALL:ZI&receive_pms=USD:ALL:ZI">💵 Zinli | USD</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=USDT:ALL:APPA&receive_pms=USDT:ALL:APPA">🔶 Apolo Pay | USDT</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&receive_pms=USDT:ALL:BYB&send_pms=USDT:ALL:BYB">🟡 Bybit | USDT</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=USDT:ALL:C01&receive_pms=USDT:ALL:C01">🟡 Binance Pay | USDT</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=USDC:ALL:ME&receive_pms=USDC:ALL:ME">🟡 Meru | USDC</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=USD:ALL:PP&receive_pms=USD:ALL:PP">🟡 Paypal | USD</option>
                    <option data-category="CRIPTO" data-url="https://explorer.syklo.io/swap#is_sending=true&send_pms=USD:ALL:AT&receive_pms=USD:ALL:AT">💵 AirTM | USDC</option>
                </optgroup>
            </select>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button id="cancelar-btn" style="background:#334155; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Cancelar</button>
                <button id="ok-btn" style="background:var(--accent-primary); color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Agregar</button>
            </div>
        </div>
    </div>

    <script>
    // Función global para abrir subventanas acopladas
    function openSykloWindow(url, windowName = "SykloWindow") {
        const width = 1180;
        const height = 820;
        const left = (screen.width - width) / 2;
        const top = (screen.height - height) / 2;
        window.open(url, windowName, `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes,status=yes`);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const vesGrid = document.getElementById('ves-grid');
        const criptoGrid = document.getElementById('cripto-grid');
        const vesEmptyState = document.getElementById('ves-empty-state');
        const criptoEmptyState = document.getElementById('cripto-empty-state');
        const modalOverlay = document.getElementById('modal-overlay');
        const addPanelBtn = document.getElementById('add-panel-btn');
        const okBtn = document.getElementById('ok-btn');
        const cancelBtn = document.getElementById('cancelar-btn');
        const panelOpcionSelect = document.getElementById('panel-opcion');
        
        const STORAGE_KEY = 'sykloDashboardPanels_v8';
        let allPanels = [];

        const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(allPanels));
        const checkEmptyStates = () => {
            vesEmptyState.classList.toggle('visible', !allPanels.some(p => p.category === 'VES'));
            criptoEmptyState.classList.toggle('visible', !allPanels.some(p => p.category === 'CRIPTO'));
        };

        const createPanelElement = (panel) => {
            const panelEl = document.createElement('div');
            panelEl.className = 'grid-panel';
            panelEl.dataset.id = panel.id;
            if(panel.pinned) panelEl.classList.add('pinned');
            
            panelEl.innerHTML = `
                <div class="panel-header">
                    <span class="panel-title">${panel.title}</span>
                    <div class="panel-controls">
                        <button class="pin-btn" title="Fijar">📌</button>
                        <button class="close-btn" title="Eliminar" style="color:var(--accent-danger);">✕</button>
                    </div>
                </div>
                <div class="panel-body">
                    <p style="font-size:12px; color:var(--text-secondary);">Mercado P2P en vivo</p>
                    <button class="panel-btn-open" onclick="openSykloWindow('${panel.url}', '${panel.id}')">
                        ⚡ Abrir Mercado
                    </button>
                </div>
            `;

            panelEl.querySelector('.close-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                if(confirm('¿Eliminar este panel?')) {
                    panelEl.remove();
                    allPanels = allPanels.filter(p => p.id !== panel.id);
                    saveState();
                    checkEmptyStates();
                }
            });

            panelEl.querySelector('.pin-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                panel.pinned = !panel.pinned;
                panelEl.classList.toggle('pinned', panel.pinned);
                if(panel.pinned) {
                    const container = panel.category === 'VES' ? vesGrid : criptoGrid;
                    container.prepend(panelEl);
                }
                saveState();
            });

            return panelEl;
        };
        
        const addPanel = (title, url, category) => {
            const newPanelData = { id: `panel-${Date.now()}`, title, url, category, pinned: false };
            allPanels.push(newPanelData);
            const panelEl = createPanelElement(newPanelData);
            const container = category === 'VES' ? vesGrid : criptoGrid;
            container.appendChild(panelEl);
            saveState();
            checkEmptyStates();
        };

        const loadState = () => {
            const savedState = localStorage.getItem(STORAGE_KEY);
            allPanels = savedState ? JSON.parse(savedState) : [];
            allPanels.sort((a, b) => (b.pinned || 0) - (a.pinned || 0));
            vesGrid.innerHTML = '';
            criptoGrid.innerHTML = '';
            allPanels.forEach(panelData => {
                const panelEl = createPanelElement(panelData);
                const container = panelData.category === 'VES' ? vesGrid : criptoGrid;
                container.appendChild(panelEl);
            });
            checkEmptyStates();
        };

        // Navegación por pestañas
        document.querySelectorAll('.tab-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelector('.tab-btn.active')?.classList.remove('active');
                e.target.classList.add('active');
                document.querySelector('.tab-panel.active')?.classList.remove('active');
                document.getElementById(`tab-panel-${e.target.dataset.tab}`)?.classList.add('active');
            });
        });

        // Control Modal
        const showModal = (show) => {
             modalOverlay.style.display = show ? 'flex' : 'none';
             if (show) panelOpcionSelect.selectedIndex = 0;
        }
        addPanelBtn.addEventListener('click', () => showModal(true));
        cancelBtn.addEventListener('click', () => showModal(false));
        modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) showModal(false) });
        
        okBtn.addEventListener('click', () => {
            const selected = panelOpcionSelect.options[panelOpcionSelect.selectedIndex];
            if (!selected || !selected.dataset.url) return;
            addPanel(selected.text, selected.dataset.url, selected.dataset.category);
            showModal(false);
        });

        loadState();
    });
    </script>
</body>
                    </html>
