<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syklo Ops Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; }
        .title { font-size: 1rem; font-weight: bold; color: #38bdf8; }
        .btn-add { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .card { background: #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; }
        .table-container { overflow-x: auto; }
        table { width: 100%; color: #e2e8f0; font-size: 0.75rem; border-collapse: collapse; text-align: left; }
        th, td { padding: 5px; border-bottom: 1px solid #1e293b; }
        th { color: #94a3b8; }
        .btn-action { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.9rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 8px; width: 90%; max-width: 300px; text-align: center; }
        select, button { width: 100%; padding: 8px; margin-top: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    </style>
</head>
<body>

    <!-- Cabecera Principal -->
    <div class="header">
        <span class="title">⚡ Syklo Ops v7.1</span>
        <button class="btn-add" onclick="abrirModal()">+ Agregar</button>
    </div>

    <!-- Contenedor Dinámico de Paneles -->
    <div id="paneles-container"></div>

    <!-- Modal para Agregar Servicio -->
    <div id="modal-servicio" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #e2e8f0;">Seleccionar Panel</h3>
            <select id="select-servicio">
                <option value="Pago Móvil|VES">📱 Pago Móvil VES</option>
                <option value="Banco de Venezuela|VES">🏦 Banco de Venezuela VES</option>
                <option value="Syklo Explorer|Navegador">📊 Explorador Syklo General</option>
            </select>
            <button style="background: #0284c7; font-weight: bold; cursor: pointer;" onclick="agregarPanel()">Agregar</button>
            <button style="background: #ef4444; font-weight: bold; cursor: pointer;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        let panelesActivos = [
            { id: 1, servicio: "Pago Móvil", moneda: "VES" },
            { id: 2, servicio: "Syklo Explorer", moneda: "Navegador" }
        ];

        function renderPaneles() {
            const container = document.getElementById('paneles-container');
            container.innerHTML = '';
            
            panelesActivos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';

                if (p.servicio === "Syklo Explorer" || p.servicio === "Syklo Web") {
                    card.innerHTML = `
                        <div class="card-header">
                            <span>📊 Explorador de Precios (Syklo)</span>
                            <div>
                                <button class="btn-action" onclick="eliminarPanel(${p.id})">❌</button>
                            </div>
                        </div>
                        <div class="iframe-container" style="width: 100%; height: 450px; background: #0f172a; border-radius: 6px; overflow: hidden;">
                            <iframe id="iframe-explorer" src="https://explorer.syklo.io/" style="width: 100%; height: 100%; border: none;"></iframe>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-header">
                            <span>📱 ${p.servicio} | ${p.moneda}</span>
                            <div>
                                <button class="btn-action" onclick="filtrarEnExplorer('${p.servicio}')" title="Ver en explorador">🔍</button>
                                <button class="btn-action" onclick="recargarPanel(${p.id})">🔄</button>
                                <button class="btn-action" onclick="eliminarPanel(${p.id})">❌</button>
                            </div>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Orden</th>
                                        <th>Precio</th>
                                        <th>Mín</th>
                                        <th>Máx</th>
                                        <th>Comerciante</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-${p.id}">
                                    <tr><td colspan="5" style="text-align: center; color: #94a3b8;">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                    cargarDatosPanel(p.id, p.servicio);
                }
                container.appendChild(card);
            });
        }

        function cargarDatosPanel(id, servicio) {
            fetch(`/api/mercado?servicio=${encodeURIComponent(servicio)}`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById(`tabla-${id}`);
                    if(!tbody) return;
                    tbody.innerHTML = '';
                    if (data.success && data.ordenes && data.ordenes.length > 0) {
                        data.ordenes.forEach(o => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${o.tipo}</td>
                                <td><strong>${o.precio.toFixed(2)}</strong></td>
                                <td>${o.min}</td>
                                <td>${o.max}</td>
                                <td>${o.comerciante}</td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Sin órdenes disponibles</td></tr>`;
                    }
                })
                .catch(() => {
                    const tbody = document.getElementById(`tabla-${id}`);
                    if(tbody) tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444;">Error al cargar datos</td></tr>`;
                });
        }

        // Función para sincronizar y filtrar el explorador según la tasa agregada/seleccionada
        function filtrarEnExplorer(servicio) {
            const iframe = document.getElementById('iframe-explorer');
            if (iframe) {
                // Actualiza la URL del explorador con el término de búsqueda/filtro
                const urlFiltrada = `https://explorer.syklo.io/?search=${encodeURIComponent(servicio)}`;
                iframe.src = urlFiltrada;
            } else {
                // Si el panel del explorador no está agregado, lo crea automáticamente
                const nuevoId = panelesActivos.length > 0 ? Math.max(...panelesActivos.map(p => p.id)) + 1 : 1;
                panelesActivos.push({ id: nuevoId, servicio: "Syklo Explorer", moneda: "Navegador" });
                renderPaneles();
                setTimeout(() => filtrarEnExplorer(servicio), 300);
            }
        }

        function abrirModal() { 
            const modal = document.getElementById('modal-servicio');
            if(modal) modal.style.display = 'flex'; 
        }

        function cerrarModal() { 
            const modal = document.getElementById('modal-servicio');
            if(modal) modal.style.display = 'none'; 
        }
        
        function agregarPanel() {
            const select = document.getElementById('select-servicio');
            if(!select) return;
            const val = select.value.split('|');
            const servicioNombre = val[0];
            const monedaNombre = val[1];

            const nuevoId = panelesActivos.length > 0 ? Math.max(...panelesActivos.map(p => p.id)) + 1 : 1;
            panelesActivos.push({ id: nuevoId, servicio: servicioNombre, moneda: monedaNombre });
            cerrarModal();
            renderPaneles();

            // Si es un método de pago, enfocar automáticamente en el explorador
            if (servicioNombre !== "Syklo Explorer") {
                filtrarEnExplorer(servicioNombre);
            }
        }

        function eliminarPanel(id) {
            if(confirm("¿Deseas quitar este panel?")) {
                panelesActivos = panelesActivos.filter(p => p.id !== id);
                renderPaneles();
            }
        }

        function recargarPanel(id) {
            const p = panelesActivos.find(item => item.id === id);
            if(p && p.servicio !== "Syklo Explorer" && p.servicio !== "Syklo Web") cargarDatosPanel(p.id, p.servicio);
        }

        document.addEventListener('DOMContentLoaded', renderPaneles);
    </script>
</body>
</html>
