<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syklo Autotrader Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
        .card { background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat { background: #0f172a; padding: 10px; border-radius: 6px; text-align: center; }
        .stat-val { font-size: 1.2rem; font-weight: bold; margin-top: 5px; color: #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-danger { background: #ef4444; }
        .logs { background: #000; color: #38bdf8; font-family: monospace; padding: 10px; border-radius: 6px; height: 120px; overflow-y: auto; font-size: 0.8rem; }
        input[type="number"] { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box; margin-top: 5px; }
        label { font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <!-- Estado General -->
    <div class="card">
        <div class="title">
            <span>⚡ Syklo Autotrader</span>
            <span id="status">🟢 Activo</span>
        </div>
        <div class="grid">
            <div class="stat">
                <div>Mercado</div>
                <div class="stat-val" id="val-mercado">--</div>
            </div>
            <div class="stat">
                <div>Tu Oferta</div>
                <div class="stat-val" id="val-oferta">--</div>
            </div>
        </div>
    </div>

    <!-- Ajustes -->
    <div class="card">
        <div class="title">⚙️ Ajustes</div>
        <label>Piso Mínimo (VES):</label>
        <input type="number" id="margen-min" step="5">
        <br><br>
        <label>Spread (+VES):</label>
        <input type="number" id="spread" step="0.01">
        <button class="btn" onclick="guardarAjustes()">💾 Guardar</button>
    </div>

    <!-- Controles -->
    <div class="card">
        <div class="title">🎮 Controles</div>
        <button id="btn-toggle" class="btn btn-danger" onclick="toggleBot()">⏸️ Pausar Bot</button>
    </div>

    <!-- Monitor de Mercado (Competencia vs Tu Oferta) -->
    <div class="card">
        <div class="title">
            <span>📊 Mercado Syklo</span>
            <button onclick="actualizarMercado()" style="background: #0284c7; border: none; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">🔄 Actualizar</button>
        </div>
        <div style="overflow-x: auto; margin-top: 5px;">
            <table style="width: 100%; color: #e2e8f0; font-size: 0.85rem; border-collapse: collapse;">
                <thead>
                    <tr style="border-bottom: 1px solid #334155; text-align: left;">
                        <th style="padding: 6px;">Trader</th>
                        <th style="padding: 6px;">Precio</th>
                        <th style="padding: 6px;">Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-mercado">
                    <tr>
                        <td colspan="3" style="padding: 8px; text-align: center; color: #94a3b8;">Cargando mercado...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Logs en Vivo -->
    <div class="card">
        <div class="title">📜 Logs en Vivo</div>
        <div class="logs" id="logs">Cargando logs...</div>
    </div>

    <script>
        function actualizarMercado() {
            fetch('/api/mercado')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const tbody = document.getElementById('tabla-mercado');
                        tbody.innerHTML = '';
                        data.ordenes.forEach(orden => {
                            const tr = document.createElement('tr');
                            tr.style.borderBottom = "1px solid #1e293b";
                            if (orden.es_mia) {
                                tr.style.background = "rgba(2, 132, 199, 0.2)";
                            }
                            tr.innerHTML = `
                                <td style="padding: 6px;"><strong>${orden.trader}</strong></td>
                                <td style="padding: 6px;">${orden.precio.toFixed(2)} VES</td>
                                <td style="padding: 6px;">${orden.es_mia ? '🟢 Tu Oferta' : '⚪ Competencia'}</td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                })
                .catch(err => console.error("Error al actualizar mercado:", err));
        }

        // Actualizar mercado automáticamente cada 5 segundos
        setInterval(actualizarMercado, 5000);
        document.addEventListener('DOMContentLoaded', actualizarMercado);
    </script>
</body>
</html>
