<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syklo Ops v7.1</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #080c14; color: #f8fafc; margin: 0; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #1e293b; }
        .title { font-size: 1rem; font-weight: bold; color: #38bdf8; }
        .btn-add { background: #2563eb; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        
        .card { background: #0f172a; border-radius: 8px; padding: 8px; margin-bottom: 12px; border: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 6px; margin-bottom: 8px; font-size: 0.88rem; font-weight: bold; color: #e2e8f0; }
        .btn-action { background: none; border: none; color: #64748b; cursor: pointer; font-size: 0.9rem; padding: 2px 6px; }
        .btn-action:hover { color: #ef4444; }

        .iframe-container { width: 100%; height: 380px; background: #020617; border-radius: 6px; overflow: hidden; border: 1px solid #1e293b; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0f172a; padding: 20px; border-radius: 8px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #1e293b; }
        select, button { width: 100%; padding: 9px; margin-top: 10px; border-radius: 6px; border: 1px solid #334155; background: #020617; color: white; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- Cabecera -->
    <div class="header">
        <span class="title">⚡ Syklo Ops v7.1</span>
        <button class="btn-add" onclick="abrirModal()">+ Agregar</button>
    </div>

    <!-- Contenedor Dinámico de Paneles -->
    <div id="paneles-container"></div>

    <!-- Modal para Seleccionar Servicio -->
    <div id="modal-servicio" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #f8fafc; font-size: 0.95rem;">Seleccionar Panel</h3>
            <select id="select-servicio">
                <optgroup label="VES">
                    <option value="Pago Móvil|VES">📱 Pago Móvil | VES</option>
                    <option value="Banesco|VES">🏦 Banesco | VES</option>
                    <option value="Bancamiga|VES">🏦 Bancamiga | VES</option>
                    <option value="BNC|VES">🏦 BNC | VES</option>
                    <option value="Venezuela|VES">🏦 Venezuela | VES</option>
                    <option value="Mercantil|VES">🏦 Mercantil | VES</option>
                    <option value="Provincial|VES">🏦 Provincial | VES</option>
                </optgroup>
                <optgroup label="CRIPTO / USD">
                    <option value="Wally|USD">💵 Wally | USD</option>
                    <option value="Zinli|USD">💵 Zinli | USD</option>
                </optgroup>
            </select>
            <button style="background: #2563eb; font-weight: bold; cursor: pointer;" onclick="agregarPanel()">Agregar</button>
            <button style="background: #dc2626; font-weight: bold; cursor: pointer;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        // Lista inicial de paneles activos
        let panelesActivos = [
            { id: 1, servicio: "Pago Móvil", moneda: "VES" },
            { id: 2, servicio: "Venezuela", moneda: "VES" }
        ];

        function renderPaneles() {
            const container = document.getElementById('paneles-container');
            container.innerHTML = '';
            
            if (panelesActivos.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 40px; color: #64748b; font-size: 0.9rem;">No hay paneles agregados.</div>`;
                return;
            }

            panelesActivos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';

                // URL del explorador configurada para pasar el término de búsqueda
                const urlExplorer = `https://explorer.syklo.io/?search=${encodeURIComponent(p.servicio)}`;

                card.innerHTML = `
                    <div class="card-header">
                        <span>📱 ${p.servicio} | ${p.moneda}</span>
                        <div>
                            <button class="btn-action" onclick="recargarIframe('iframe-${p.id}')">🔄</button>
                            <button class="btn-action" onclick="eliminarPanel(${p.id})">❌</button>
                        </div>
                    </div>
                    <div class="iframe-container">
                        <iframe id="iframe-${p.id}" src="${urlExplorer}" allow="clipboard-read; clipboard-write"></iframe>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function abrirModal() { 
            const modal = document.getElementById('modal-servicio');
            if(modal) modal.style.display = 'flex'; 
        }

        function cerrarModal() { 
            const modal = document.getElementById('modal-servicio');
            if(modal) modal.style.display = 'none'; 
        }
        
        function agregarPanel() {
            const select = document.getElementById('select-servicio');
            if(!select) return;
            const val = select.value.split('|');
            const servicioNombre = val[0];
            const monedaNombre = val[1];

            const nuevoId = panelesActivos.length > 0 ? Math.max(...panelesActivos.map(p => p.id)) + 1 : 1;
            panelesActivos.push({ id: nuevoId, servicio: servicioNombre, moneda: monedaNombre });
            cerrarModal();
            renderPaneles();
        }

        function eliminarPanel(id) {
            if(confirm("¿Eliminar este panel?")) {
                panelesActivos = panelesActivos.filter(p => p.id !== id);
                renderPaneles();
            }
        }

        function recargarIframe(iframeId) {
            const iframe = document.getElementById(iframeId);
            if(iframe) {
                const currentSrc = iframe.src;
                iframe.src = '';
                iframe.src = currentSrc;
            }
        }

        document.addEventListener('DOMContentLoaded', renderPaneles);
    </script>
</body>
</html>
